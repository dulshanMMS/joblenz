<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <!-- Outer lens ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <!-- Inner lens centre -->
  <circle cx="16" cy="16" r="3.5" fill="#7c3aed"/>
  <!-- Aperture tick marks -->
  <line x1="16" y1="5"  x2="16" y2="8.5"  stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="23.5" x2="16" y2="27" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <line x1="5"  y1="16" x2="8.5"  y2="16" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <line x1="23.5" y1="16" x2="27" y2="16" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
</svg>
